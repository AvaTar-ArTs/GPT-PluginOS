name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --no-build-isolation .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Registry validation
        run: pluginos validate
      - name: Compile registry
        run: pluginos compile --output /tmp/pluginos.compiled.json
      - name: Build lockfile
        run: pluginos lock --output /tmp/pluginos.lock.json
      - name: Route smoke test
        run: pluginos route media.image.upscale --policy quality-first --json
      - name: Audit smoke test
        run: pluginos audit
